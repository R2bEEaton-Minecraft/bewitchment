plugins {
    id 'dev.architectury.loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

// Lets the porting run use an isolated remap cache while an IDE has the
// standard build directory open for source indexing.
if (project.hasProperty('portBuildDir')) {
    buildDir = file(project.property('portBuildDir'))
}

loom {
    accessWidenerPath = file("src/main/resources/bewitchment.accesswidener")

    forge {
        mixinConfig "bewitchment.mixins.json"
        convertAccessWideners = true
    }

    mixin {
        defaultRefmapName.set("bewitchment.refmap.json")
    }

    runs {
        client {
            client()
            setConfigName("Forge Client")
            ideConfigGenerated(true)
            runDir("run-native-forge-port")
        }
        server {
            server()
            setConfigName("Forge Server")
            ideConfigGenerated(true)
            runDir("run-native-forge-port")
        }
    }
}

sourceSets.main.java.exclude('moriyashiine/bewitchment/client/integration/emi/**')
sourceSets.main.java.exclude('moriyashiine/bewitchment/mixin/integration/apoli/**')

repositories {
    maven { url "https://maven.su5ed.dev/releases" }
    maven { url "https://maven.ladysnake.org/releases" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url "https://maven.terraformersmc.com" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.ryanliptak.com" }
    maven { url "https://maven.theillusivec4.top/" }
    maven { url "https://maven.shedaniel.me" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Temporary compile-only bridge while the remaining Fabric events are
    // migrated. It is intentionally never placed in a Forge runtime.
    modCompileOnly "dev.su5ed.sinytra.fabric-api:fabric-api:${forgified_fabric_api_version}"

    // API-only dependencies retained for source compatibility.  Their Forge
    // counterparts (or Connector Extras where applicable) are required at run time.
    modImplementation "vazkii.patchouli:Patchouli:${patchouli_version}"
    modImplementation "top.theillusivec4.curios:curios-forge:${curios_version}"
    modImplementation "squeek.appleskin:appleskin-forge:${appleskin_version}"
}

processResources {
	// Forge loads META-INF/mods.toml. Leaving the Fabric descriptor on the
	// development classpath makes Connector discover this project twice.
	exclude "fabric.mod.json"
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "forge_version_range": project.forge_version_range,
                "loader_version_range": project.loader_version_range,
                "minecraft_version_range": project.minecraft_version_range,
                "forgified_fabric_api_version": project.forgified_fabric_api_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    finalizedBy 'reobfJar'
}
