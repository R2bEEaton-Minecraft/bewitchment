plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run-native-forge-port')
            property 'forge.logging.console.level', 'info'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

sourceSets {
    main {
        java {
            // The original mod is Yarn/Fabric source. It stays in the tree for
            // incremental migration but is not valid ForgeGradle input yet.
            setSrcDirs(['src/forge/java'])
        }
        resources {
            setSrcDirs(['src/main/resources'])
        }
    }
}

repositories {
    maven { url 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            version: project.version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range
    ]
    inputs.properties properties
    // The native bootstrap does not yet register the legacy Fabric items or
    // custom recipe serializers. Do not expose their datapack files until the
    // corresponding Forge registries have been migrated.
    exclude 'data/**'
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
