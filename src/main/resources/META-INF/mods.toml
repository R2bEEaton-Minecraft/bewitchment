modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"

[[mods]]
modId="bewitchment"
version="${version}"
displayName="Bewitchment"
displayURL="https://www.curseforge.com/minecraft/mc-mods/bewitchment"
logoFile="assets/bewitchment/icon.png"
authors="MoriyaShiine, cybercat5555"
description='''A mod that aims to add witchcraft.'''

[[dependencies.bewitchment]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.bewitchment]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.bewitchment]]
modId="fabric_api"
mandatory=true
versionRange="[${forgified_fabric_api_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.bewitchment]]
modId="patchouli"
mandatory=true
versionRange="[${patchouli_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.bewitchment]]
modId="curios"
mandatory=true
versionRange="[${curios_version},)"
ordering="NONE"
side="BOTH"

# Client-side quality-of-life integrations.  Bewitchment runs normally when
# either mod is absent; if installed, load it before Bewitchment's hooks.
[[dependencies.bewitchment]]
modId="appleskin"
mandatory=false
versionRange="[${appleskin_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.bewitchment]]
modId="emi"
mandatory=false
versionRange="[${emi_version},)"
ordering="AFTER"
side="CLIENT"
